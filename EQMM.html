<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ellery Queen Mystery Magazine</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .archive-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 2rem 0;
        }
        .archive-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #ddd;
        }
        .archive-header h1 {
            margin-top: 0;
            font-size: 2.2em;
            color: #222;
        }
        .archive-header .subtitle {
            color: #666;
            font-size: 0.95em;
            margin-top: 0.5em;
        }
        .decade-section {
            margin-bottom: 4rem;
        }
        .decade-title {
            font-size: 1.5em;
            color: #444;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #333;
            display: inline-block;
        }
        .magazine-grid {
            display: grid;
            gap: 2rem 1.5rem;
            grid-template-columns: repeat(2, 1fr);
        }
        .magazine-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .magazine-cover {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            border: 1px solid #ddd;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .magazine-cover:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .magazine-link {
            margin-top: 0.75rem;
            font-size: 0.85em;
            color: #333;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .magazine-link:hover {
            color: #666;
            text-decoration: underline;
        }
        .magazine-link.disabled {
            color: #999;
            cursor: default;
            text-decoration: none;
        }
        .magazine-link.disabled:hover {
            text-decoration: none;
        }
        @media screen and (min-width: 600px) {
            .magazine-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2.5rem 1.5rem;
            }
        }
        @media screen and (min-width: 900px) {
            .magazine-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 3rem 2rem;
            }
            .magazine-link {
                font-size: 0.9em;
            }
        }
        @media screen and (min-width: 1200px) {
            .magazine-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 3rem 2rem;
            }
        }
        @media screen and (min-width: 1500px) {
            .magazine-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 3.5rem 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="archive-container">
        <header class="archive-header">
            <h1>Ellery Queen Mystery Magazine</h1>
            <p class="subtitle">MYSTERY MAGAZINE ARCHIVE</p>
        </header>
        <section class="decade-section">
            <h2 class="decade-title">1941</h2>
            <div class="magazine-grid">
                <div class="magazine-item">
                    <a href="./EQMM-1941.html">
                        <img src="covers/1941-fall.jpg" alt="EQMM-1941-Fall" class="magazine-cover">
                    </a>
                    <a href="./EQMM-1941.html" class="magazine-link">FALL 1941</a>
                </div>
            </div>
        </section>
        <section class="decade-section">
            <h2 class="decade-title">1942</h2>
            <div class="magazine-grid">
                <div class="magazine-item">
                    <a href="./EQMM-1942.html#eqmm-spring-1942">
                        <img src="covers/1941-fall.jpg" alt="EQMM-1942-Spring" class="magazine-cover">
                    </a>
                    <a href="./EQMM-1942.html#eqmm-spring-1942" class="magazine-link">SPRING 1942</a>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
